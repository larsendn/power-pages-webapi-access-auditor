name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Reject static Dataverse table bindings
        shell: pwsh
        run: |
          $matches = Get-ChildItem solution/PowerPagesWebApiFieldsAuditor/src/Workflows -Filter '*.json' |
            Select-String -Pattern '"entityName"\s*:\s*"(?!@concat\()'
          if ($matches) {
            $matches | ForEach-Object { Write-Error "$($_.Path):$($_.LineNumber) $($_.Line.Trim())" }
            exit 1
          }